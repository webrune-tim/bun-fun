<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bun Real-Time Chat</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <h2>Bun Real-Time Chat</h2>
  </header>

  <main id="messages"></main>

  <footer>
    <form id="chatForm">
      <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off" required />
      <button type="submit">Send</button>
    </form>
  </footer>

  <script>
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${location.host}/ws`);
    const messages = document.getElementById('messages');
    const form = document.getElementById('chatForm');
    const input = document.getElementById('msgInput');

    let currentUserId = null;

    ws.onmessage = (event) => {
      let data;
      try {
        data = JSON.parse(event.data);
      } catch (err) {
        data = { type: 'chat', text: event.data, username: 'Unknown', userId: 'anon' };
      }

      if (data.type === 'init') {
        currentUserId = data.userId;
        return;
      }

      const msg = document.createElement('div');

      if (data.type === 'system') {
        msg.className = 'message system';
        msg.textContent = `⚡ ${data.text}`;
      } else if (data.type === 'chat') {
        const isSelf = data.userId === currentUserId;
        msg.className = `message user ${isSelf ? 'self' : 'other'} user-${data.userId}`;

        const author = document.createElement('span');
        author.className = 'author';
        author.textContent = isSelf ? 'You: ' : `${data.username}: `;

        const content = document.createElement('span');
        content.className = 'content';
        content.textContent = data.text;

        msg.appendChild(author);
        msg.appendChild(content);
      }

      messages.appendChild(msg);
      messages.scrollTop = messages.scrollHeight;
    };

    form.onsubmit = (e) => {
      e.preventDefault();
      if (input.value.trim()) {
        ws.send(input.value);
        input.value = '';
      }
    };
  </script>
</body>
</html>
