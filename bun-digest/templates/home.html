<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/styles.css" />
  <title>Bun Digest</title>
</head>
<body>
  <div class="container">
    <nav class="top-bar">
      <a href="/" class="brand-title">
        <span class="brand-logo-dot"></span>
        Bun Digest
      </a>
      <div class="auth-status-container" id="authStatusContainer">
        <!-- AUTH_STATUS_BAR -->
      </div>
    </nav>

    <header class="hero-header">
      <div class="hero-badge">⚡ Bun 1.4 &bull; Turso &bull; BetterAuth</div>
      <h1>Modern Native Publishing</h1>
      <p>High-performance content platform powered by Bun 1.4 native Markdown compiler, Turso LibSQL, and BetterAuth.</p>
    </header>

    <main class="grid">
      <section>
        <h2 class="section-title">Latest Articles</h2>
        <ul class="articles-list">
          <!-- ARTICLES_LIST -->
        </ul>
      </section>

      <section class="card">
        <h2 class="section-title">Publish Markdown Article</h2>
        <!-- AUTH_FORM_NOTICE -->
        <form id="postForm">
          <input id="title" type="text" placeholder="Article Title" required />
          <input id="slug" type="text" placeholder="slug (e.g., post-one)" required />
          <textarea id="markdown" placeholder="## Write markdown here..." required></textarea>
          <button id="submitBtn" type="submit">Submit &amp; Compile</button>
        </form>
      </section>
    </main>
  </div>

  <!-- BetterAuth Modal Dialog -->
  <dialog id="authModal" class="auth-dialog">
    <div class="dialog-header">
      <h3 id="authModalTitle">Sign In</h3>
      <button type="button" class="dialog-close" onclick="closeAuthModal()" aria-label="Close dialog">&times;</button>
    </div>

    <div class="auth-tabs">
      <button type="button" id="tabSignIn" class="auth-tab-btn active" onclick="switchAuthTab('signin')">Sign In</button>
      <button type="button" id="tabSignUp" class="auth-tab-btn" onclick="switchAuthTab('signup')">Sign Up</button>
    </div>

    <div id="authErrorMessage" class="form-error" role="alert"></div>

    <button type="button" class="btn-google" onclick="signInGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24" style="vertical-align: middle; margin-right: 6px;">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-divider">
      <span>or with email</span>
    </div>

    <!-- Sign In Form -->
    <form id="signInForm" onsubmit="handleSignIn(event)">
      <input type="email" id="signInEmail" placeholder="Email address" required autocomplete="email" />
      <input type="password" id="signInPassword" placeholder="Password" required autocomplete="current-password" />
      <button type="submit" style="width: 100%;">Sign In</button>
    </form>

    <!-- Sign Up Form -->
    <form id="signUpForm" onsubmit="handleSignUp(event)" style="display: none;">
      <input type="text" id="signUpName" placeholder="Your Name" required autocomplete="name" />
      <input type="email" id="signUpEmail" placeholder="Email address" required autocomplete="email" />
      <input type="password" id="signUpPassword" placeholder="Password (min 8 chars)" minlength="8" required autocomplete="new-password" />
      <button type="submit" style="width: 100%;">Create Account</button>
    </form>
  </dialog>

  <script>
    const authModal = document.getElementById('authModal');
    const authError = document.getElementById('authErrorMessage');
    let currentAuthTab = 'signin';

    function openAuthModal(tab = 'signin') {
      switchAuthTab(tab);
      authError.textContent = '';
      authError.classList.remove('visible');
      authModal.showModal();
    }

    function closeAuthModal() {
      authModal.close();
    }

    function switchAuthTab(tab) {
      currentAuthTab = tab;
      const isSignIn = tab === 'signin';
      document.getElementById('authModalTitle').textContent = isSignIn ? 'Sign In' : 'Create Account';
      document.getElementById('tabSignIn').classList.toggle('active', isSignIn);
      document.getElementById('tabSignUp').classList.toggle('active', !isSignIn);
      document.getElementById('signInForm').style.display = isSignIn ? 'block' : 'none';
      document.getElementById('signUpForm').style.display = isSignIn ? 'none' : 'block';
      authError.textContent = '';
      authError.classList.remove('visible');
    }

    async function handleSignIn(e) {
      e.preventDefault();
      authError.classList.remove('visible');
      const email = document.getElementById('signInEmail').value;
      const password = document.getElementById('signInPassword').value;

      try {
        const res = await fetch('/api/auth/sign-in/email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.reload();
        } else {
          authError.textContent = data.message || data.error || 'Sign in failed';
          authError.classList.add('visible');
        }
      } catch (err) {
        authError.textContent = err.message || 'Network error';
        authError.classList.add('visible');
      }
    }

    async function handleSignUp(e) {
      e.preventDefault();
      authError.classList.remove('visible');
      const name = document.getElementById('signUpName').value;
      const email = document.getElementById('signUpEmail').value;
      const password = document.getElementById('signUpPassword').value;

      try {
        const res = await fetch('/api/auth/sign-up/email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.reload();
        } else {
          authError.textContent = data.message || data.error || 'Registration failed';
          authError.classList.add('visible');
        }
      } catch (err) {
        authError.textContent = err.message || 'Network error';
        authError.classList.add('visible');
      }
    }

    async function handleSignOut() {
      try {
        await fetch('/api/auth/sign-out', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({})
        });
        window.location.reload();
      } catch (err) {
        console.error('Sign out error:', err);
      }
    }

    async function signInGoogle() {
      authError.classList.remove('visible');
      try {
        const res = await fetch('/api/auth/sign-in/social', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ provider: 'google', callbackURL: '/' })
        });
        const data = await res.json();
        if (res.ok && data.url) {
          window.location.href = data.url;
        } else {
          authError.textContent = data.message || data.error || 'Failed to initiate Google sign in';
          authError.classList.add('visible');
        }
      } catch (err) {
        authError.textContent = err.message || 'Network error';
        authError.classList.add('visible');
      }
    }

    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        title: document.getElementById('title').value,
        slug: document.getElementById('slug').value,
        markdown: document.getElementById('markdown').value
      };
      try {
        const res = await fetch('/api/articles', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/articles/' + payload.slug;
        } else if (res.status === 401) {
          alert('You must be signed in to publish articles.');
          openAuthModal('signin');
        } else {
          alert('Failed to save article: ' + (data.error || 'Unknown error'));
        }
      } catch (err) {
        alert('Network error: ' + err.message);
      }
    });
  </script>
</body>
</html>
